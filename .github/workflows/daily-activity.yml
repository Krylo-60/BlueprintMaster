name: Daily Activity Pulse

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ - BlueprintMaster pulse update" >> .github/activity.log

      - name: Commit and push activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/activity.log
          git commit -m "Automated build sync and activity record [skip ci]" || exit 0
          git push origin main || git push origin master
